name: build

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand (Actions > build > Run workflow) on main with "official"
  # ticked to publish an official release.
  workflow_dispatch:
    inputs:
      official:
        description: "Publish an official release (vX.Y). Unticked, it only builds."
        type: boolean
        default: false
      version:
        description: "Official version, e.g. 1.0. Empty: the one after the last official release."
        type: string
        default: ""

jobs:
  # vX.Y for official releases, vX.Y.Z for betas; see .github/version.sh.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      title: ${{ steps.v.outputs.title }}
      channel: ${{ steps.v.outputs.channel }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          KIND: ${{ inputs.official && 'official' || 'beta' }}
          WANTED: ${{ inputs.version }}
        run: |
          if [ "$KIND" = official ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Official releases are made from main"
            exit 1
          fi
          bash .github/version.sh "$KIND" "$WANTED" | tee -a "$GITHUB_OUTPUT"
      # For workflows that run after this one (the iPhone build).
      - name: Save the version
        run: printf 'SSND_VERSION=%s\nSSND_TAG=%s\n' "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.tag }}" > version.env
      - uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.env

  linux:
    needs: version
    # Oldest supported image, so the binary runs on Ubuntu 22.04 / Debian 12 and newer.
    runs-on: ubuntu-22.04
    env:
      # Baked into the app; the updater compares it with the release tags.
      SSND_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Sound (libpulse) and window libraries are loaded at run time, so the
      # binary itself only links glibc.
      - name: Install window libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ssnd-core -p stream-sound
      - run: cargo build --locked --release
      - name: Package
        run: |
          mkdir -p out
          cp target/release/stream-sound out/StreamSound-linux-x86_64
          echo "Linked libraries:"
          readelf -d out/StreamSound-linux-x86_64 | grep NEEDED
      - uses: actions/upload-artifact@v4
        with:
          name: StreamSound-linux-x64
          path: out/StreamSound-linux-x86_64

  windows:
    needs: version
    runs-on: windows-latest
    env:
      SSND_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ssnd-core -p stream-sound
      - run: cargo build --locked --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/StreamSound | Out-Null
          Copy-Item target/release/stream-sound.exe out/StreamSound/StreamSound.exe
      - uses: actions/upload-artifact@v4
        with:
          name: StreamSound-windows-x64
          path: out/StreamSound

  android:
    needs: version
    runs-on: ubuntu-24.04
    env:
      # Also gives the versionCode (android/app/build.gradle.kts).
      SSND_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the engine for Android
        # The runner image exports ANDROID_NDK_LATEST_HOME as a shell variable;
        # it is not visible to the `env` expression context.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Using NDK at $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 29 -o android/app/src/main/jniLibs build --locked --release -p ssnd-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the app
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Package
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/StreamSound.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StreamSound-android
          path: out/StreamSound.apk

  # Every change on main becomes a beta release, and a run by hand with
  # "official" ticked an official one. Earlier releases are never removed.
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.official))
    needs: [version, linux, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir -p release
          cp artifacts/StreamSound-linux-x64/StreamSound-linux-x86_64 release/
          cp artifacts/StreamSound-windows-x64/StreamSound.exe release/StreamSound-windows-x64.exe
          (cd artifacts/StreamSound-windows-x64 && zip -9 ../../release/StreamSound-windows-x64.zip StreamSound.exe)
          cp artifacts/StreamSound-android/StreamSound.apk release/
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.title }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          make_latest: ${{ needs.version.outputs.latest }}
          generate_release_notes: true
          body: |
            ${{ needs.version.outputs.channel == 'official' && 'Official release (เวอร์ชันทางการ).' || 'Beta (เวอร์ชันเบต้า): the newest changes, tested less than an official release.' }}

            Windows: StreamSound-windows-x64.zip (or the .exe)
            Linux: StreamSound-linux-x86_64 (chmod +x, then run)
            Android: StreamSound.apk

            Apps that are already installed update themselves from here. Every earlier version stays on the Releases page.
          files: release/*
      # Releases from before version numbers were titled "Stream Sound build N".
      - name: Name older releases by version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,name \
            --jq '.[] | select(.name | startswith("Stream Sound build ")) | .tagName' |
            while read -r tag; do
              gh release edit "$tag" --title "Stream Sound $tag (Beta)"
            done
