name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install audio and window libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ssnd-core
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: StreamSound-linux-x64
          path: target/release/stream-sound

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ssnd-core
      - run: cargo build --locked --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/StreamSound | Out-Null
          Copy-Item target/release/stream-sound.exe out/StreamSound/StreamSound.exe
      - uses: actions/upload-artifact@v4
        with:
          name: StreamSound-windows-x64
          path: out/StreamSound

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the engine for Android
        # The runner image exports ANDROID_NDK_LATEST_HOME as a shell variable;
        # it is not visible to the `env` expression context.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Using NDK at $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 29 -o android/app/src/main/jniLibs build --locked --release -p ssnd-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the app
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Package
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/StreamSound.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StreamSound-android
          path: out/StreamSound.apk
