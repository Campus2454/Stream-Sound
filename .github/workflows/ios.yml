name: ios

# The iPhone app is built on a cloud Mac. It is not signed here: SideStore,
# AltStore or Sideloadly sign it with your own Apple ID when installing.
on:
  pull_request:
  workflow_dispatch:
  # After each build of main (which publishes release v0.1.<n>), add the
  # iPhone app and its SideStore source to that same release.
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

concurrency:
  group: ios-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      # Same build number as the release this belongs to; 0 for test builds,
      # so an installed test build always offers the next real release.
      SSND_BUILD: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_number || 0 }}
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      # Public releases-only repo (see build.yml); used once RELEASES_TOKEN is set.
      RELEASES_REPO: Campus2454/Audio-Streaming-Releases
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/rust
      - name: Test the engine bridge
        working-directory: ios/rust
        run: cargo test --locked
      - name: Build the engine for iPhone
        working-directory: ios/rust
        run: |
          cargo build --locked --release --target aarch64-apple-ios
          mkdir -p ../build/rust/iphoneos
          cp target/aarch64-apple-ios/release/libssnd_ios.a ../build/rust/iphoneos/
          ls -la ../build/rust/iphoneos
      - name: Generate the Xcode project
        working-directory: ios
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build the app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project StreamSound.xcodeproj -scheme StreamSound -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CURRENT_PROJECT_VERSION="$SSND_BUILD" MARKETING_VERSION="0.1.$SSND_BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build/xcodebuild.log | grep -E "error|warning: .*\.swift|BUILD" || true
          test -d build/dd/Build/Products/Release-iphoneos/StreamSound.app
      - name: Package the .ipa
        working-directory: ios
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/StreamSound.app build/ipa/Payload/
          APP=build/ipa/Payload/StreamSound.app
          ls "$APP" "$APP/PlugIns"
          test -d "$APP/PlugIns/StreamSoundBroadcast.appex"
          # Ad-hoc signature; the installer replaces it with yours.
          codesign --force --sign - "$APP/PlugIns/StreamSoundBroadcast.appex"
          codesign --force --sign - "$APP"
          (cd build/ipa && zip -qry ../../StreamSound.ipa Payload)
          ls -la StreamSound.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$APP/Info.plist"
      - name: Write the SideStore / AltStore source
        working-directory: ios
        run: |
          # SideStore can only read a public repo, so point at the releases repo when there is one.
          REPO="${{ github.repository }}"
          if [ -n "$RELEASES_TOKEN" ]; then REPO="$RELEASES_REPO"; fi
          cp App/Assets.xcassets/AppIcon.appiconset/icon-1024.png StreamSound-icon.png
          python3 source.py StreamSound.ipa "$SSND_BUILD" "$REPO" > StreamSound-source.json
          cat StreamSound-source.json
      - uses: actions/upload-artifact@v4
        with:
          name: StreamSound-ios
          path: ios/StreamSound.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: ios/build/xcodebuild.log
      - name: Add to the release
        if: github.event_name == 'workflow_run'
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v0.1.$SSND_BUILD" StreamSound.ipa StreamSound-source.json StreamSound-icon.png --clobber --repo "${{ github.repository }}"
      - name: Add to the public releases repo
        if: github.event_name == 'workflow_run' && env.RELEASES_TOKEN != ''
        working-directory: ios
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release upload "v0.1.$SSND_BUILD" StreamSound.ipa StreamSound-source.json StreamSound-icon.png --clobber --repo "$RELEASES_REPO"
