[package]
name = "ssnd-core"
version = "0.1.0"
edition = "2021"
description = "Stream Sound audio engine: LAN streaming, jitter buffer, mixing, relay"

[dependencies]
anyhow = "1"
parking_lot = "0.12"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
gethostname = "0.5"

[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2"
libpulse-simple-binding = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
